<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЖИ-детектив / ИИ-детектив</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d1d1f;--muted:#5f5f66;--card:#fff;--line:#dcd8cf;--accent:#2f5d8a;--ok:#1f7a4d;--okbg:#dff3e8;--no:#9a9a9f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--fg:#f1f1f3;--muted:#a3a3ab;--card:#212328;--line:#34363d;--accent:#7fb0e0;--ok:#5fd39a;--okbg:#173828;--no:#6d6d74}}
:root[data-theme="dark"]{--bg:#16171a;--fg:#f1f1f3;--muted:#a3a3ab;--card:#212328;--line:#34363d;--accent:#7fb0e0;--ok:#5fd39a;--okbg:#173828;--no:#6d6d74}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:clamp(16px,2.1vw,28px)/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1200px;width:100%;margin:0 auto;padding:4vh 16px}
.tag{color:var(--accent);font-weight:600;font-size:.75em;letter-spacing:.04em;text-transform:uppercase;margin-bottom:.6em}
h1{font-size:2.2em;line-height:1.15;margin:0 0 .3em}
h2{font-size:1.45em;line-height:1.2;margin:0}
.ru{color:var(--muted);font-weight:400;margin-top:.25em;font-size:.85em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin-top:1.2em}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.7em .9em;display:flex;gap:.6em;align-items:flex-start}
.opt b{color:var(--accent);min-width:1.2em}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok b{color:var(--ok)}
.opt.dim{opacity:.45}
.ex{margin-top:1em;background:var(--card);border-left:4px solid var(--ok);border-radius:8px;padding:.7em 1em;font-size:.8em}
.ex p{margin:.2em 0}
.ex .ru{font-size:1em}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);font-size:1.1em}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:1em}
ol.rules{padding-left:1.2em;margin:.8em 0 0}
ol.rules li{margin-bottom:.7em}
footer{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
button{font:inherit;font-size:15px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
@media (max-width:700px){.opts{grid-template-columns:1fr}h1{font-size:1.7em}}
</style>
</head>
<body>
<main id="app"></main>
<footer>
  <span id="pos"></span>
  <span>← → / Space</span>
  <span><button id="prev">←</button> <button id="next" class="primary">→</button></span>
</footer>
<script>
const D={"q": [{"round": 0, "type": "mc", "time": 30, "kz": "ЖИ кітап ұсынса, ол кітап міндетті түрде бар.", "ru": "Если ИИ рекомендует книгу, она обязательно существует.", "options": ["Шын / Правда", "Жалған / Миф"], "correct": [2], "ex_kz": "Жалған. 2025 ж. мамырда Chicago Sun-Times және Philadelphia Inquirer газеттері ЖИ құрастырған жазғы оқу тізімін жариялады: 15 кітаптың кемінде 10-ы жоқ болып шықты.", "ex_ru": "Миф. В мае 2025 г. Chicago Sun-Times и Philadelphia Inquirer напечатали летний список чтения, составленный ИИ: минимум 10 из 15 книг не существуют.", "src": ["https://404media.co/chicago-sun-times-prints-ai-generated-summer-reading-list-with-books-that-dont-exist/", "https://www.niemanlab.org/2025/05/you-wont-find-these-on-the-shelf-newspapers-print-an-ai-generated-reading-list-with-fake-books/"]}, {"round": 0, "type": "mc", "time": 30, "kz": "Қазақстанда «Жасанды интеллект туралы» жеке заң қабылданды.", "ru": "В Казахстане принят отдельный закон «Об искусственном интеллекте».", "options": ["Шын / Правда", "Жалған / Миф"], "correct": [1], "ex_kz": "Шын. Президент заңға 2025 ж. 17 қарашада қол қойды. Заң ЖИ жасаған контентті таңбалауды талап етеді, дипфейк үшін әкімшілік жауапкершілік енгізеді.", "ex_ru": "Правда. Президент подписал закон 17 ноября 2025 г. Закон требует маркировать контент, созданный ИИ, и вводит административную ответственность за дипфейки.", "src": ["https://www.kt.kz/eng/government/tokayev_signs_law_on_artificial_intelligence_1377983990.html", "https://en.orda.kz/kazakhstan-adopts-first-law-regulating-artificial-intelligence-9301/"]}, {"round": 0, "type": "mc", "time": 30, "kz": "ЖИ-детекторлар мәтінді адам немесе ЖИ жазғанын сенімді түрде анықтайды.", "ru": "AI-детекторы надёжно определяют, написал текст человек или ИИ.", "options": ["Шын / Правда", "Жалған / Миф"], "correct": [2], "ex_kz": "Жалған. OpenAI өз детекторын 2023 ж. шілдеде «дәлдігі төмен» деп жапты: ол ЖИ мәтінінің тек 26%-ын таныды, ал адам мәтінінің 9%-ын қате «ЖИ» деп белгіледі.", "ex_ru": "Миф. OpenAI закрыла свой детектор в июле 2023 г. из-за «низкой точности»: он распознавал лишь 26% ИИ-текстов и в 9% случаев ошибочно помечал тексты людей как ИИ.", "src": ["https://techcrunch.com/2023/07/25/openai-scuttles-ai-written-text-detector-over-low-rate-of-accuracy/"]}, {"round": 0, "type": "mc", "time": 30, "kz": "ҚР заңы бойынша шығарманың авторы — жеке тұлға, яғни адам.", "ru": "По закону РК автор произведения — физическое лицо, то есть человек.", "options": ["Шын / Правда", "Жалған / Миф"], "correct": [1], "ex_kz": "Шын. «Авторлық құқық және сабақтас құқықтар туралы» Заң (1996, № 6-I), 2-бап: автор — шығармашылық еңбегімен шығарма жасаған жеке тұлға. Сондықтан ЖИ «автор» бола алмайды.", "ex_ru": "Правда. Закон «Об авторском праве и смежных правах» (1996, № 6-I), ст. 2: автор — физическое лицо, творческим трудом которого создано произведение. Поэтому ИИ «автором» не является.", "src": ["https://adilet.zan.kz/rus/docs/Z960000006_"]}, {"round": 1, "type": "mc", "time": 45, "kz": "Қай кітап ЖОҚ (ЖИ ойдан шығарған)?", "ru": "Какой книги НЕ существует (её выдумал ИИ)?", "options": ["Мұхтар Әуезов — «Абай жолы»", "Ілияс Есенберлин — «Көшпенділер»", "Әбдіжәміл Нұрпейісов — «Қан мен тер»", "Мұхтар Әуезов — «Дала алгоритмі»"], "correct": [4], "ex_kz": "«Дала алгоритмі» — ойдан шығарылған. ЖИ жиі шын автордың атына жоқ кітапты «жапсырады», сондықтан әр атауды каталогтан тексеру керек.", "ex_ru": "«Дала алгоритмі» — выдумка. ИИ часто приписывает реальному автору несуществующую книгу, поэтому каждое название надо проверять по каталогу.", "src": ["Учебный пример (фейк создан для игры)"]}, {"round": 1, "type": "cb", "time": 45, "kz": "Газеттегі ЖИ тізімінен (2025). Қай кітаптар ОЙДАН ШЫҒАРЫЛҒАН? (бірнеше жауап)", "ru": "Из ИИ-списка в газете (2025). Какие книги ВЫДУМАНЫ? (несколько ответов)", "options": ["Энди Вейер — «The Last Algorithm»", "Исабель Альенде — «Tidewater Dreams»", "Рэй Брэдбери — «Вино из одуванчиков»", "Андре Асиман — «Назови меня своим именем»"], "correct": [1, 2], "ex_kz": "Вейер мен Альенде мұндай кітап жазбаған. Брэдбери мен Асиманның кітаптары — шын. Шын авторлар + жалған атаулар — ЖИ «галлюцинациясының» классикалық белгісі.", "ex_ru": "Вейер и Альенде таких книг не писали. Книги Брэдбери и Асимана реальны. Реальные авторы + выдуманные названия — классический признак «галлюцинации» ИИ.", "src": ["https://www.vice.com/en/article/newspapers-summer-reading-list-was-filled-with-fake-ai-generated-books", "https://gizmodo.com/chicago-paper-summer-reading-list-fake-books-ai-2000604708"]}, {"round": 1, "type": "mc", "time": 45, "kz": "2023 ж. АҚШ-та адвокаттар сотқа ChatGPT ойдан шығарған сот істерін ұсынды. Немен аяқталды?", "ru": "В 2023 г. в США адвокаты подали в суд дела, выдуманные ChatGPT. Чем это закончилось?", "options": ["Сот бәрін қабылдады / Суд всё принял", "Адвокаттарға 5000 $ айыппұл / Адвокатов оштрафовали на 5000 $", "ChatGPT-ке айыппұл салынды / Оштрафовали ChatGPT", "Ешкім байқамады / Никто не заметил"], "correct": [2], "ex_kz": "Mata v. Avianca ісі: судья 2023 ж. 22 маусымда адвокаттарға 5000 $ айыппұл салды. Жауапкершілік ЖИ-де емес, оны пайдаланған адамда.", "ex_ru": "Дело Mata v. Avianca: 22 июня 2023 г. судья оштрафовал адвокатов на 5000 $. Ответственность несёт не ИИ, а человек, который им пользуется.", "src": ["https://news.bloomberglaw.com/litigation/fake-chatgpt-cases-costs-lawyers-5-000-plus-embarrassment"]}, {"round": 2, "type": "mc", "time": 45, "kz": "Оқушы ЖИ құрастырған әдебиет тізімін әкелді. Кітапханашының ең дұрыс әрекеті?", "ru": "Ученик принёс список литературы от ИИ. Лучшее действие библиотекаря?", "options": ["Тізімді сол күйі қабылдау / Принять список как есть", "ЖИ-ден «сенімдісің бе?» деп сұрау / Спросить у ИИ «ты уверен?»", "Оқушымен бірге әр кітапты каталог пен ISBN бойынша тексеру / Вместе с учеником проверить каждую книгу по каталогу и ISBN", "ЖИ-ге мүлдем тыйым салу / Полностью запретить ИИ"], "correct": [3], "ex_kz": "ЖИ өз қатесін «растап» жіберуі мүмкін. Тексеру — тәуелсіз дереккөз арқылы: кітапхана каталогы, Ұлттық кітапхана, ISBN. Оқушыны тексеруге үйрету — медиасауаттылық.", "ex_ru": "ИИ может «подтвердить» собственную ошибку. Проверка — по независимому источнику: каталог библиотеки, Национальная библиотека, ISBN. Научить ученика проверять — это и есть медиаграмотность.", "src": ["Практика проверки источников; см. случаи из вопросов 1, 6, 7"]}, {"round": 2, "type": "mc", "time": 45, "kz": "Мұғалім: «Детектор эссені 90% ЖИ жазды деді — екі қоямыз». Кітапханашы не кеңес береді?", "ru": "Учитель: «Детектор показал 90% ИИ — ставим двойку». Что посоветует библиотекарь?", "options": ["Детекторға толық сену / Полностью довериться детектору", "Тағы бір детектормен тексеріп, жазалау / Проверить вторым детектором и наказать", "Детекторлар қателеседі: оқушымен жұмыс барысы мен жобалары туралы сөйлесу / Детекторы ошибаются: поговорить с учеником о ходе работы и черновиках", "Үй эсселеріне тыйым салу / Запретить домашние эссе"], "correct": [3], "ex_kz": "Детектор — дәлел емес (3-сұрақты қараңыз: OpenAI детекторы адам мәтінінің 9%-ын қате белгілеген). Әділ жол — жұмыс процесін талқылау.", "ex_ru": "Детектор — не доказательство (см. вопрос 3: детектор OpenAI ошибочно помечал 9% текстов людей). Честный путь — обсудить процесс работы.", "src": ["https://techcrunch.com/2023/07/25/openai-scuttles-ai-written-text-detector-over-low-rate-of-accuracy/"]}, {"round": 2, "type": "mc", "time": 45, "kz": "Оқушы түйіндеме жасау үшін чат-ботқа аты-жөнін, мекенжайын және ЖСН-ін жазғысы келеді. Не дейсіз?", "ru": "Ученик хочет ввести в чат-бот ФИО, адрес и ИИН, чтобы составить резюме. Что скажете?", "options": ["Болады, ЖИ деректерді сақтамайды / Можно, ИИ не хранит данные", "Жеке деректерді енгізбе: үлгіні ЖИ-мен жаса, деректерді өзің жаз / Личные данные не вводить: шаблон — с ИИ, данные вписать самому", "Тек ЖСН-ді жазба / Не вводить только ИИН", "Ата-анасының деректерін жазсын / Пусть введёт данные родителей"], "correct": [2], "ex_kz": "ЮНЕСКО (2023) мектепте ЖИ қолданғанда жеке деректерді қорғауды талап етеді және сыныпта ЖИ қолдану үшін 13 жас шегін қарастыруды ұсынады. ҚР-да «Дербес деректер және оларды қорғау туралы» Заң (2013, № 94-V) бар.", "ex_ru": "ЮНЕСКО (2023) требует защищать персональные данные при использовании ИИ в школе и предлагает рассмотреть возрастной порог 13 лет. В РК действует Закон «О персональных данных и их защите» (2013, № 94-V).", "src": ["https://news.un.org/en/story/2023/09/1140477", "https://adilet.zan.kz/rus/docs/Z1300000094"]}], "rounds": [["1-раунд: «Шын ба, миф пе?»", "Раунд 1: «Факт или миф?»"], ["2-раунд: «Жалғанын тап»", "Раунд 2: «Найди фейк»"], ["3-раунд: «Кітапханашы не істейді?»", "Раунд 3: «Что сделает библиотекарь?»"]], "rules": [["ТЕКСЕР: ЖИ атаған әр кітапты, мақаланы, фактіні каталогтан немесе түпнұсқадан тексер.", "ПРОВЕРЯЙ: каждую книгу, статью и факт от ИИ — по каталогу или первоисточнику."], ["ҚОРҒА: жеке деректерді (аты-жөні, ЖСН, мекенжай) чат-ботқа енгізбе.", "ЗАЩИЩАЙ: не вводи личные данные (ФИО, ИИН, адрес) в чат-бот."], ["ЖАУАП БЕР: ЖИ — көмекші, шешім мен жауапкершілік — адамда.", "ОТВЕЧАЙ: ИИ — помощник, решение и ответственность — за человеком."]]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const split=s=>{const i=s.indexOf(" / ");return i<0?[s,""]:[s.slice(0,i),s.slice(i+3)]};
// steps
const S=[{k:"intro"}];
let lastRound=-1;
D.q.forEach((q,i)=>{if(q.round!==lastRound){S.push({k:"round",r:q.round});lastRound=q.round}S.push({k:"q",i});S.push({k:"a",i})});
S.push({k:"rules"});
let cur=0,timer=null;
const app=document.getElementById("app");
function opts(q,reveal){return '<div class="opts">'+q.options.map((o,n)=>{const ok=q.correct.includes(n+1);const [a,b]=split(o);const cls=reveal?(ok?"ok":"dim"):"";return `<div class="opt ${cls}"><b>${"ABCDE"[n]}</b><div>${esc(a)}${b?`<div class="ru">${esc(b)}</div>`:""}</div></div>`}).join("")+"</div>"}
function render(){
  clearInterval(timer);
  const s=S[cur];let h="";
  if(s.k==="intro"){h=`<div class="tag">Интеллектуалдық ойын · Интеллектуальная игра</div><h1>ЖИ-детектив</h1><h2 class="ru">ИИ-детектив</h2><p style="margin-top:1.2em">Жасанды интеллект заманындағы мектеп кітапханасы:<br>жаңа мүмкіндіктер мен сын-қатерлер</p><p class="ru">10 сұрақ · 3 раунд · 15 минут</p>`}
  else if(s.k==="round"){const [kz,ru]=D.rounds[s.r];h=`<div class="tag">${s.r+1} / 3</div><h1>${esc(kz)}</h1><h2 class="ru">${esc(ru)}</h2>`}
  else if(s.k==="q"||s.k==="a"){const q=D.q[s.i];const rev=s.k==="a";
    h=`<div class="top"><div class="tag">${s.i+1} / ${D.q.length}${q.type==="cb"?" · бірнеше жауап / несколько ответов":""}</div>${rev?"":`<div class="timer" id="t">${q.time}</div>`}</div><h2>${esc(q.kz)}</h2><div class="ru">${esc(q.ru)}</div>${opts(q,rev)}`;
    if(rev)h+=`<div class="ex"><p>${esc(q.ex_kz)}</p><p class="ru">${esc(q.ex_ru)}</p></div>`;
  }
  else{h=`<div class="tag">Қорытынды · Итог</div><h1>3 ереже / 3 правила</h1><ol class="rules">${D.rules.map(([a,b])=>`<li>${esc(a)}<div class="ru">${esc(b)}</div></li>`).join("")}</ol>`}
  app.innerHTML=h;
  document.getElementById("pos").textContent=(cur+1)+" / "+S.length;
  if(s.k==="q"){let t=D.q[s.i].time;const el=document.getElementById("t");timer=setInterval(()=>{t--;el.textContent=Math.max(t,0);if(t<=0){clearInterval(timer);el.textContent="⏰"}},1000)}
}
const go=d=>{cur=Math.min(S.length-1,Math.max(0,cur+d));render()};
document.getElementById("next").onclick=()=>go(1);
document.getElementById("prev").onclick=()=>go(-1);
addEventListener("keydown",e=>{if(["ArrowRight"," ","PageDown","Enter"].includes(e.key)){e.preventDefault();go(1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(-1)}});
render();
</script>
</body>
</html>
